name: Build Gyro-Aim v2.0 Firmware (RP2350 @ 250MHz)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Pico 2 W v2.0 (.uf2)
    runs-on: ubuntu-latest

    env:
      PICO_SDK_REF: "2.3.1"
      TINYUSB_REF: "98741b55959564746998d0453c32d87064629d7c"
      ARM_TOOLCHAIN_URL: "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.2.rel1/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz"
      ARM_TOOLCHAIN_PATH: "${{ github.workspace }}/arm-toolchain"
      PICO_SDK_PATH: "${{ github.workspace }}/pico-sdk"

    steps:
      - name: Checkout DS5-Bridge-GyroAim Source
        uses: actions/checkout@v4
        with:
          path: gyro-aim-repo

      - name: Install System Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 build-essential xz-utils curl git

      - name: Cache ARM Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.ARM_TOOLCHAIN_PATH }}
          key: arm-toolchain-15.2.rel1-v1

      - name: Download & Extract ARM GNU Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ARM_TOOLCHAIN_PATH"
          curl -sSL "$ARM_TOOLCHAIN_URL" -o arm-toolchain.tar.xz
          tar -xf arm-toolchain.tar.xz -C "$ARM_TOOLCHAIN_PATH" --strip-components=1
          rm arm-toolchain.tar.xz

      - name: Add ARM Toolchain to PATH
        run: |
          echo "$ARM_TOOLCHAIN_PATH/bin" >> $GITHUB_PATH

      - name: Clone Raspberry Pi Pico SDK & Pin TinyUSB
        run: |
          git clone --depth 1 --branch "$PICO_SDK_REF" https://github.com/raspberrypi/pico-sdk.git "$PICO_SDK_PATH"
          for m in lib/tinyusb lib/cyw43-driver lib/btstack lib/lwip; do
            git -C "$PICO_SDK_PATH" submodule update --init --depth 1 "$m"
          done
          git -C "$PICO_SDK_PATH/lib/tinyusb" fetch --depth 1 origin "$TINYUSB_REF"
          git -C "$PICO_SDK_PATH/lib/tinyusb" checkout --detach FETCH_HEAD

      - name: Clone Upstream DS5Dongle (v0.8.0)
        run: |
          git clone --depth 1 --branch v0.8.0 --recurse-submodules --shallow-submodules https://github.com/awalol/DS5Dongle.git ds5dongle

      - name: Inject Gyro-Aim v2.0 & 250MHz Overclock Patch
        shell: bash
        run: |
          cp gyro-aim-repo/src/gyro_aim.cpp ds5dongle/src/
          cp gyro-aim-repo/src/gyro_aim.h ds5dongle/src/
          cd ds5dongle
          git apply --whitespace=fix ../gyro-aim-repo/src/patch_against_official_v0.7.2.patch
          git diff

      - name: Compile RP2350 v2.0 Firmware (Ninja Release)
        shell: bash
        run: |
          cd ds5dongle
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$PICO_SDK_PATH"

          cmake --build build --target ds5-bridge -j$(nproc)

          # Verify zero dynamic memory allocation in gyro_aim.cpp.o
          if arm-none-eabi-nm -u build/CMakeFiles/ds5-bridge.dir/src/gyro_aim.cpp.o | grep -E "malloc|free|realloc|calloc|_Znw|_Zdl|_Zna|_Zda"; then
            echo "ERROR: Dynamic memory allocation symbols found in gyro_aim.cpp.o!"
            exit 1
          fi

          mkdir -p ../output
          cp build/ds5-bridge.uf2 ../output/ds5-bridge-v0.7.2-gyroL2.uf2
          cp build/ds5-bridge.uf2 ../output/ds5-bridge-v0.8.0-gyroL2-new.uf2

      - name: Upload UF2 Firmware as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DS5-Bridge-GyroAim-v2.0-RP2350-250MHz
          path: output/*.uf2
          if-no-files-found: error
